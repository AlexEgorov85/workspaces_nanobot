name: CI

on:
  push:
    branches: [master, release/**]
  pull_request:
    branches: [master, release/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Fast tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff coverage

      - name: Lint with ruff
        run: ruff check lib workspace tests tools

      - name: Run fast tests (no live, no integration)
        env:
          NANOBOT_LIVE_E2E: "0"
          NANOBOT_INTEGRATION: "0"
        run: pytest tests/ -m "not live and not integration" -q --tb=short

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: fast-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov coverage

      - name: Run coverage
        env:
          NANOBOT_LIVE_E2E: "0"
          NANOBOT_INTEGRATION: "0"
        run: |
          coverage run -m pytest tests/ -m "not live and not integration" -q
          coverage report
          coverage xml -o coverage.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  upgrade-readiness:
    name: Upgrade readiness (contract tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run contract tests
        env:
          NANOBOT_LIVE_E2E: "0"
          NANOBOT_INTEGRATION: "0"
        run: pytest tests/contract/ -v --tb=short