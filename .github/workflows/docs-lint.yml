name: Docs Lint

on:
  push:
    branches: [master, release/**]
  pull_request:
    branches: [master, release/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-size:
    name: README.md size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check README.md size (≤ 250 строк)
        run: |
          lines=$(wc -l < README.md)
          echo "README.md: ${lines} lines"
          if [ "$lines" -gt 250 ]; then
            echo "::error::README.md is too large (${lines} > 250 lines). Move content to docs/"
            exit 1
          fi

      - name: Check no Pandoc anchors
        run: |
          if grep -nE '\(#[^)]+\)\{#' README.md docs/*.md docs/**/*.md 2>/dev/null; then
            echo "::error::Found Pandoc anchors (#[..]{..}). GitHub Markdown does not support them — use header slugs."
            exit 1
          fi

      - name: Check no broken seed_default_indexes duplicates
        run: |
          count=$(grep -c "psql -d nanobot -f sql/audit_analyzer/seed_default_indexes.sql" README.md || true)
          if [ "$count" -gt 1 ]; then
            echo "::error::Found ${count} duplicates of 'psql ... seed_default_indexes.sql'. Should be 1."
            exit 1
          fi

  code-blocks:
    name: Code blocks have language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect opening code blocks without language
        run: |
          python3 - <<'PY'
          import os, re, sys
          # Только OPENING fences должны иметь info string. Закрывающий fence
          # по CommonMark 0.31.2 не может содержать ничего, кроме
          # fence-символов и пробелов/табов (см. https://spec.commonmark.org/0.31.2/).
          #
          # Алгоритм: для каждой ``` строки определяем, opening она или
          # closing — opening, если fence в этой позиции не закрывает
          # предыдущий открытый блок. Стандартный парсинг через state
          # machine. Если строка — opening без info string → ошибка.
          opening_bare = re.compile(r'^```\s*$')
          fence = re.compile(r'^```')
          bad = []
          for root, _, files in os.walk('.'):
              if any(p in root for p in ('.git', '.venv', 'node_modules')):
                  continue
              for fn in files:
                  if not fn.endswith('.md'):
                      continue
                  path = os.path.join(root, fn)
                  with open(path, encoding='utf-8') as f:
                      in_block = False
                      for n, line in enumerate(f, 1):
                          stripped = line.lstrip()
                          if not fence.match(stripped):
                              continue
                          # Это fence-строка. Определяем, opening или closing.
                          if in_block:
                              # Строка закрывает текущий блок.
                              in_block = False
                          else:
                              # Строка открывает новый блок.
                              in_block = True
                              if opening_bare.match(stripped):
                                  bad.append(f'{path}:{n}: opening fenced block without language')
          if bad:
              for b in bad:
                  print(f'::error::{b}')
              sys.exit(1)
          print('All opening code blocks have language hints.')
          PY
