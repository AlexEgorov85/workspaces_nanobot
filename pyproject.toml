[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    # FAISS SWIG-биндинги не имеют __module__; предупреждение приходит из
    # importlib._bootstrap при загрузке C-расширения _faiss (не наш код).
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
markers = [
    "live: live e2e (real gateway / live DB / live LLM); needs NANOBOT_LIVE_E2E=1",
    "integration: worker pool on real DB; needs NANOBOT_INTEGRATION=1 (+ DATABASE_URL)"
]

[tool.coverage.run]
source = ["config.py", "benchmarks", "lib"]
omit = ["*/__pycache__/*", "*.pyc"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pylint]
disable = ["C0114", "C0115", "C0116", "R0903", "R0913"]
