# Сложные задания (сложность 8-10)
# Многошаговый анализ реальных данных oarb с итоговым отчётом

- id: "hard-effectiveness-report"
  name: "Отчёт по эффективности проверок"
  difficulty: 8
  category: "audit_analyzer"
  type: "multi_step"
  new_session: false
  max_iterations: 40
  timeout: 300
  steps:
    - step: 1
      weight: 0.3
      question: >-
        Запусти предопределённый скрипт analytics_by_year_month с параметром
        year=2024 через skills/audit_analyzer/scripts/cli.py и покажи,
        сколько проверок прошло по месяцам.
      expect:
        tools: ["exec"]
        keywords_include: ["2024", "проверок"]
    - step: 2
      weight: 0.3
      question: >-
        Запусти скрипт audit_effectiveness и определи, какая проверка имеет
        наибольшее число нарушений и какой у неё уровень серьёзности.
      expect:
        tools: ["exec"]
        
        keywords_include: ["severity_level", "критическ"]
    - step: 3
      weight: 0.4
      question: >-
        По результатам двух предыдущих шагов собери итоговый отчёт по
        эффективности аудиторских проверок за 2024 год и сохрани его в файл
        data_store/cache/effectiveness_report.md.
      expect:
        tools: ["write_file"]
        check_file: "data_store/cache/effectiveness_report.md"
        match_type: "llm_judge"
        goal: "Отчёт содержит итоги по эффективности аудиторских проверок за 2024 год: помесячную картину и выделение проверки с наибольшим числом нарушений и её уровнем серьёзности"

- id: "hard-dynamics-report"
  name: "Отчёт по динамике проверок"
  difficulty: 9
  category: "audit_analyzer"
  type: "multi_step"
  new_session: false
  max_iterations: 45
  timeout: 300
  steps:
    - step: 1
      weight: 0.3
      question: >-
        Запусти предопределённый скрипт analytics_by_year_month с параметром
        year=2024 через skills/audit_analyzer/scripts/cli.py и покажи,
        в каких месяцах 2024 года проходили проверки и сколько их было.
      expect:
        tools: ["exec"]
        keywords_include: ["2024", "проверок"]
    - step: 2
      weight: 0.3
      question: >-
        Запусти скрипт top_audited_objects и покажи, какие объекты
        проверялись чаще всего в 2024 году.
      expect:
        tools: ["exec"]
        keywords_include: ["объект", "проверок"]
    - step: 3
      weight: 0.4
      question: >-
        Собери итоговый отчёт по динамике аудиторских проверок за 2024 год:
        помесячное распределение и список наиболее проверяемых объектов.
        Сохрани его в файл data_store/cache/dynamics_report.md.
      expect:
        tools: ["write_file"]
        check_file: "data_store/cache/dynamics_report.md"
        match_type: "llm_judge"
        goal: "Отчёт отражает динамику проверок за 2024 год: помесячное распределение и список наиболее проверяемых объектов"

- id: "hard-violations-analysis"
  name: "Анализ нарушений по кодам"
  difficulty: 9
  category: "audit_analyzer"
  type: "multi_step"
  new_session: false
  max_iterations: 45
  timeout: 300
  steps:
    - step: 1
      weight: 0.3
      question: >-
        Запусти предопределённый скрипт violations_by_type через
        skills/audit_analyzer/scripts/cli.py и покажи распределение
        нарушений по кодам.
      expect:
        tools: ["exec"]
        keywords_include: ["VIOL", "нарушений"]
    - step: 2
      weight: 0.3
      question: >-
        Запусти скрипт top_audited_objects и покажи, какие объекты
        проверялись чаще всего.
      expect:
        tools: ["exec"]
        keywords_include: ["объект", "проверок"]
    - step: 3
      weight: 0.4
      question: >-
        Собери итоговый отчёт по нарушениям: какие коды нарушений самые
        частые и какие объекты проверялись чаще всего. Сохрани его в файл
        data_store/cache/violations_report.md.
      expect:
        tools: ["write_file"]
        check_file: "data_store/cache/violations_report.md"
        match_type: "llm_judge"
        goal: "Отчёт содержит распределение нарушений по кодам и список наиболее проверяемых объектов"