# Средние задания (сложность 4-7)
# Анализ реальных данных oarb через tool nl_sql_generate / duckdb_query.

- id: "medium-schema-relations"
  name: "Связи таблиц"
  difficulty: 4
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Объясни, как таблицы audits, audit_reports, report_items и violations
    связаны между собой. Какие колонки соединяют их друг с другом?
    Используй tool nl_sql_generate или duckdb_query для просмотра
    information_schema и references/schema.md навыка.
  max_iterations: 15
  expect:
    tools: ["nl_sql_generate", "duckdb_query"]
    keywords_include: ["audit_id", "report_id"]

- id: "medium-audit-types"
  name: "Статистика по типам проверок"
  difficulty: 5
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Какие типы аудиторских проверок встречаются в базе и как часто?
    Используй tool nl_sql_generate для генерации SELECT по oarb.audits
    с группировкой по audit_type.
  max_iterations: 40
  expect:
    tools: ["nl_sql_generate"]
    keywords_include: ["audit_type", "Внеплановая"]

- id: "medium-violations-by-type"
  name: "Нарушения по кодам"
  difficulty: 6
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Сгруппируй нарушения по кодам и покажи, какие коды встречаются чаще
    всего и в скольких разных проверках. Используй tool nl_sql_generate
    или duckdb_query с GROUP BY violation_code по oarb.violations.
  max_iterations: 20
  expect:
    tools: ["nl_sql_generate", "duckdb_query"]
    keywords_include: ["VIOL", "нарушений"]

- id: "medium-effectiveness"
  name: "Эффективность проверок"
  difficulty: 6
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Проанализируй эффективность аудиторских проверок: для каждой проверки
    посчитай число нарушений и уровень серьёзности (severity). Какие
    проверки попали в категории «Критические» и «Без нарушений»?
    Используй tool nl_sql_generate для генерации SELECT с JOIN
    audits × violations.
  max_iterations: 40
  expect:
    tools: ["nl_sql_generate"]
    keywords_include: ["severity", "Критическ"]

- id: "medium-dynamics"
  name: "Динамика проверок"
  difficulty: 5
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Покажи динамику проведения проверок по месяцам 2024 года: в каких
    месяцах прошли проверки и сколько их было. Используй tool
    nl_sql_generate.
  max_iterations: 30
  expect:
    tools: ["nl_sql_generate"]
    keywords_include: ["проверок", "2024"]

- id: "medium-top-objects"
  name: "Топ проверяемых объектов"
  difficulty: 6
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Какие объекты чаще всего проверялись аудиторами? Используй tool
    nl_sql_generate для генерации SELECT с GROUP BY auditee_entity
    по oarb.audits и ORDER BY count DESC.
  max_iterations: 20
  expect:
    tools: ["nl_sql_generate"]
    keywords_include: ["объект", "проверок"]