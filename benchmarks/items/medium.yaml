# Средние задания (сложность 4-7)
# Анализ реальных данных oarb через audit_analyzer (predefined-скрипты)

- id: "medium-schema-relations"
  name: "Связи таблиц"
  difficulty: 4
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Посмотри на схему базы в schema.json и объясни, как таблицы audits,
    audit_reports, report_items и violations связаны между собой. Какие колонки
    соединяют их друг с другом?
  max_iterations: 15
  expect:
    tools: ["read_file"]
    keywords_include: ["audit_id", "report_id"]

- id: "medium-audit-types"
  name: "Статистика по типам проверок"
  difficulty: 5
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Какие типы аудиторских проверок встречаются в базе и как часто?
    Запусти предопределённый скрипт audit_types_stats через
    skills/audit_analyzer/audit_analyze.bat и перечисли типы с их количеством.
  max_iterations: 40
  expect:
    tools: ["exec"]
    keywords_include: ["audit_type", "Внеплановая"]

- id: "medium-violations-by-type"
  name: "Нарушения по кодам"
  difficulty: 6
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Сгруппируй нарушения по кодам и покажи, какие коды встречаются чаще всего
    и в скольких разных проверках. Запусти script violations_by_type через
    skills/audit_analyzer/audit_analyze.bat.
  max_iterations: 20
  expect:
    tools: ["exec"]
    
    keywords_include: ["VIOL", "нарушений"]

- id: "medium-effectiveness"
  name: "Эффективность проверок"
  difficulty: 6
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Проанализируй эффективность аудиторских проверок: для каждой проверки
    посчитай число нарушений и уровень серьёзности (severity_level). Какие
    проверки попали в категории «Критические» и «Без нарушений»? Запусти
    предопределённый скрипт audit_effectiveness.
  max_iterations: 40
  expect:
    tools: ["exec"]
    keywords_include: ["severity_level", "Критические"]

- id: "medium-dynamics"
  name: "Динамика проверок"
  difficulty: 5
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Покажи динамику проведения проверок по месяцам 2024 года: в каких месяцах
    прошли проверки и сколько их было. Запусти предопределённый скрипт
    analytics_by_year_month с параметром year=2024.
  max_iterations: 30
  expect:
    tools: ["exec"]
    keywords_include: ["проверок", "2024"]

- id: "medium-top-objects"
  name: "Топ проверяемых объектов"
  difficulty: 6
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Какие объекты чаще всего проверялись аудиторами? Запусти предопределённый
    скрипт top_audited_objects и перечисли объекты с количеством проверок
    по убыванию.
  max_iterations: 20
  expect:
    tools: ["exec"]
    
    keywords_include: ["объект", "проверок"]