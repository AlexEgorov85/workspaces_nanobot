# Режим выбора — бенчмарк для audit_analyzer.
#
# Цель: проверить, что агент правильно выбирает один из трёх режимов:
# 1. Predefined scripts (run_predefined_script)
# 2. Vector search (vector_search)
# 3. NL → SQL (nl_sql_generate) — fallback
#
# Метрика — правильность ВЫБОРА РЕЖИМА, а не качество SQL.
#
# Поля:
#   * expected_mode: predefined | vector | nl_sql
#   * expected_tool: имя tool'а из глобального expect.tools
#   * expected_script: имя скрипта (для predefined)
#   * expected_index: имя FAISS-индекса (для vector)
#
# Запускается как обычный benchmark-item:
#   python benchmarks/runner.py --items benchmarks/items/audit_mode_selection.yaml --dry-run

# === Predefined (10 заданий) ===

