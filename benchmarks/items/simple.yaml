# Простые задания (сложность 1-3)
# Естественные вопросы пользователя о данных в схеме oarb БД аудита

- id: "simple-greeting"
  name: "Приветствие"
  difficulty: 1
  category: "basic"
  type: "single"
  new_session: true
  question: "Поздоровайся"
  max_iterations: 5
  expect:
    keywords_include: ["привет"]
    keywords_exclude: ["error"]

- id: "simple-schema-tables"
  name: "Таблицы базы аудита"
  difficulty: 2
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Посмотри на структуру базы в файле skills/audit_analyzer/cache/schema.json.
    Какие таблицы относятся к схеме oarb и сколько их всего?
  max_iterations: 10
  expect:
    tools: ["read_file"]
    keywords_include: ["oarb", "violations"]

- id: "simple-schema-violations"
  name: "Структура нарушений"
  difficulty: 2
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    В базе аудита есть таблица violations. Расскажи, из каких колонок она
    состоит и что означает каждая из них.
  max_iterations: 10
  expect:
    tools: ["read_file"]
    keywords_include: ["severity", "violation_code"]

- id: "simple-audits-2024"
  name: "Проверки за 2024 год"
  difficulty: 3
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Покажи, сколько аудиторских проверок прошло в 2024 году по месяцам.
    Воспользуйся навыком audit_analyzer: запусти скрипт analytics_by_year_month
    с параметром year=2024 через skills/audit_analyzer/scripts/cli.py
    (режим predefined).
  max_iterations: 15
  expect:
    tools: ["exec"]
    
    keywords_include: ["2024", "проверк"]

- id: "simple-violations-table"
  name: "Значения серьёзности"
  difficulty: 3
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Посмотри на схему таблицы violations в schema.json. Какие значения может
    принимать колонка severity и какого она типа?
  max_iterations: 10
  expect:
    tools: ["read_file"]
    keywords_include: ["severity", "Низкая"]