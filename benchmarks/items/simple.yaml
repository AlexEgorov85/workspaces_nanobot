# Простые задания (сложность 1-3)
# Естественные вопросы пользователя о данных в схеме oarb БД аудита.
#
# После перевода skill'а на tool-only агент больше НЕ запускает
# ``skills/audit_analyzer/scripts/cli.py`` — всё через generic tools.

- id: "simple-greeting"
  name: "Приветствие"
  difficulty: 1
  category: "basic"
  type: "single"
  new_session: true
  question: "Поздоровайся"
  max_iterations: 5
  expect:
    keywords_include: ["привет"]
    keywords_exclude: ["error"]

- id: "simple-schema-tables"
  name: "Таблицы базы аудита"
  difficulty: 2
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Какие таблицы относятся к схеме oarb и сколько их всего?
    Используй tool duckdb_query с SELECT к information_schema.tables.
  max_iterations: 10
  expect:
    tools: ["duckdb_query"]
    keywords_include: ["oarb", "violations"]

- id: "simple-schema-violations"
  name: "Структура нарушений"
  difficulty: 2
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    В базе аудита есть таблица violations. Расскажи, из каких колонок она
    состоит и что означает каждая из них. Используй tool duckdb_query
    с information_schema.columns для oarb.violations.
  max_iterations: 10
  expect:
    tools: ["duckdb_query"]
    keywords_include: ["severity", "violation_code"]

- id: "simple-audits-2024"
  name: "Проверки за 2024 год"
  difficulty: 3
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Покажи, сколько аудиторских проверок прошло в 2024 году по месяцам.
    Используй tool nl_sql_generate.
  max_iterations: 15
  expect:
    tools: ["nl_sql_generate"]
    keywords_include: ["2024", "проверк"]

- id: "simple-violations-table"
  name: "Значения серьёзности"
  difficulty: 3
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: >-
    Какие значения может принимать колонка severity в таблице violations
    и какого она типа? Используй tool duckdb_query:
    SELECT severity, count(*) FROM oarb.violations GROUP BY severity.
  max_iterations: 10
  expect:
    tools: ["duckdb_query"]
    keywords_include: ["severity"]