# Простые задания (сложность 1-3)
# Базовое знакомство с предметной областью аудиторских проверок

- id: "simple-greeting"
  name: "Приветствие"
  difficulty: 1
  category: "basic"
  type: "single"
  new_session: true
  question: "Поздоровайся"
  max_iterations: 5
  expect:
    keywords_include: ["привет"]
    keywords_exclude: ["error"]

- id: "simple-date"
  name: "Текущая дата"
  difficulty: 1
  category: "basic"
  type: "single"
  new_session: true
  question: "Какая сегодня дата?"
  max_iterations: 5
  expect:
    keywords_include: ["2026"]

- id: "simple-schema-tables"
  name: "Схема БД"
  difficulty: 2
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: "Прочитай файл skills/audit_analyzer/cache/schema.json и перечисли все таблицы в схеме oarb. Сколько их?"
  max_iterations: 10
  expect:
    tools: ["read_file"]
    keywords_include: ["таблиц", "oarb"]

- id: "simple-skill-modes"
  name: "Режимы анализа"
  difficulty: 2
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: "Прочитай SKILL.md навыка audit_analyzer (skills/audit_analyzer/SKILL.md) и перечисли три режима анализа, которые доступны"
  max_iterations: 10
  expect:
    tools: ["read_file"]
    keywords_include: ["predefined", "vector", "sql"]

- id: "simple-scripts-list"
  name: "Список скриптов"
  difficulty: 2
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: "Прочитай файл реестра скриптов skills/audit_analyzer/scripts/scripts_registry.py и перечисли все предопределённые скрипты аналитики (их имена)"
  max_iterations: 15
  expect:
    tools: ["read_file"]
    keywords_include: ["analytics", "violations", "audit"]

- id: "simple-db-config"
  name: "Конфиг анализатора"
  difficulty: 2
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: "Прочитай config.json навыка audit_analyzer (skills/audit_analyzer/config.json) и скажи, какой LLM провайдер используется и какая модель"
  max_iterations: 10
  expect:
    tools: ["read_file"]
    keywords_include: ["openai"]

- id: "simple-violations-table"
  name: "Структура нарушений"
  difficulty: 3
  category: "audit_analyzer"
  type: "single"
  new_session: true
  question: "Прочитай schema.json и опиши структуру таблицы violations: какие колонки есть, какой тип у severity и какие значения она может принимать"
  max_iterations: 15
  expect:
    tools: ["read_file"]
    keywords_include: ["severity", "нарушен"]
