<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Презентация</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>mermaid.initialize({startOnLoad:true,theme:'default',flowchart:{useMaxWidth:false,htmlLabels:true}});</script>
</head>
<body>
    <div id="presentation">
        <div id="slides-container"></div>
        <div id="nav">
            <button id="prev-btn" title="Назад (←)">←</button>
            <span id="counter">1 / 1</span>
            <button id="next-btn" title="Вперёд (→)">→</button>
            <button id="fullscreen-btn" title="На весь экран (F)">⛶</button>
        </div>
        <div id="progress"><div id="progress-bar"></div></div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var slides = document.querySelectorAll('.slide');
            if (!slides.length) return;
            var current = 0;
            var counter = document.getElementById('counter');
            var progressBar = document.getElementById('progress-bar');
            function showSlide(n) {
                slides.forEach(function(s) { s.classList.remove('active'); });
                slides[n].classList.add('active');
                current = n;
                counter.textContent = (n + 1) + ' / ' + slides.length;
                progressBar.style.width = ((n + 1) / slides.length * 100) + '%';
            }
            document.getElementById('prev-btn').addEventListener('click', function() {
                if (current > 0) showSlide(current - 1);
            });
            document.getElementById('next-btn').addEventListener('click', function() {
                if (current < slides.length - 1) showSlide(current + 1);
            });
            document.getElementById('fullscreen-btn').addEventListener('click', function() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
                    e.preventDefault();
                    if (current < slides.length - 1) showSlide(current + 1);
                } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (current > 0) showSlide(current - 1);
                } else if (e.key === 'f' || e.key === 'F') {
                    document.getElementById('fullscreen-btn').click();
                } else if (e.key === 'Home') {
                    showSlide(0);
                } else if (e.key === 'End') {
                    showSlide(slides.length - 1);
                }
            });
            showSlide(0);
        });
    </script>
</body>
</html>
