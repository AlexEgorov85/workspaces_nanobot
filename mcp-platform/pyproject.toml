[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "enterprise-mcp-platform"
version = "0.1.0"
description = "Enterprise MCP servers, independent from nanobot"
requires-python = ">=3.11"

# ВАЖНО: nanobot-ai здесь отсутствует намеренно и навсегда.
# Установка этого пакета не должна тянуть agent runtime.
dependencies = [
    "mcp>=1.27",
    # Разгрузка синхронных обработчиков с event loop транспорта
    # (anyio.to_thread.run_sync в libs/enterprise_common/loader.py и
    # servers/*/server.py). Объявлен явно, а не «приедет из mcp»: платформа
    # зовёт его сама, и на чужом списке зависимостей держаться нельзя.
    "anyio>=4.0",
    # Владелец доступа к данным. psycopg2 существует ровно в одном пакете
    # платформы — libs/enterprise_data.
    "psycopg2-binary==2.9.12",
    # Обязателен: без AST-ветки guard пропускает pg_sleep, information_schema
    # и UPDATE/DELETE после -- комментария. Сервер не поднимается без него.
    "sqlglot==30.17.0",
    # Владелец HTTP-клиента провайдера (libs/llm).
    "httpx>=0.27",
    # ASGI-сервер транспорта streamable-http (servers/enterprise/
    # http_transport.py). В mcp приходит транзитивно, но транспорт зовёт
    # uvicorn напрямую, и объявление обязано называть то, что зовёт код.
    "uvicorn>=0.30",
    # Владелец снимка (libs/enterprise_data/snapshot) и владелец индексов
    # (libs/vectors). Импортируются ЛЕНИВО, внутри функций: отсутствие любого
    # из них не должно мешать подняться серверу и ломать capability, которая
    # с ним не связана, — history_search работает и без FAISS. Смысл зависимостей
    # в том, что установленный пакет платформы функционален целиком.
    "duckdb>=1.0",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    # Сериализация батчей снимка в Arrow (libs/enterprise_data/snapshot/
    # writer.py). Импорт ленивый, но отсутствие пакета — не «мягкая деградация»:
    # writer.py:304 обязан отказать громко, иначе молча уходит пустая таблица.
    "pyarrow>=23.0",
    # Вывод пула PostgreSQL в консоль (libs/enterprise_data/db.py). Тоже
    # ленивый: без него платформа обязана работать, просто молча.
    "rich>=13.0",
    # Разбор офисных документов. Живёт в libs/office (перенесён из агента,
    # п. 11.1) и читается доменом legal_summarizer: document/physical.py,
    # document/loader.py, application/document_io.py. Пины — как в
    # requirements.txt агента: сервер запускается тем же интерпретатором
    # (project.json::enterprise_mcp.command = ${NANOBOT_PYTHON}), поэтому
    # «свой» диапазон версий здесь означал бы расхождение с окружением
    # агента, а не свободу выбора.
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    # .xls (старый бинарный формат) — openpyxl его не читает.
    "xlrd==2.0.2",
    "pypdf==5.9.0",
    "pdfplumber==0.11.10",
    "python-pptx==1.0.2",
    # Определение кодировки текстовых файлов. В libs/office/parser.py
    # необязателен: без него кодировка подбирается перебором
    # utf-8/cp1251/latin-1, но точность падает, поэтому пакет объявлен.
    "chardet==7.6.0",
    # Структурированный лог домена (libs/legal_summarizer/document/hierarchy.py).
    "loguru==0.7.3",
]

[project.optional-dependencies]
# capability legal (фаза 8): python-docx, openpyxl, pypdf, pdfplumber, python-pptx, Pillow
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools]
# Явный список, а не find_packages: лишний пакет в платформе должен попасть
# сюда руками и быть замечен в diff'е, а не подхватиться молча.
packages = [
    "libs",
    "libs.enterprise_common",
    "libs.enterprise_data",
    "libs.enterprise_data.snapshot",
    "libs.llm",
    "libs.vectors",
    "servers",
    "servers._template",
    "servers._template.capabilities",
    "servers._template.capabilities.template",
    "servers._template.capabilities.template.service",
    "servers._template.capabilities.template.tools",
    "servers.enterprise",
    "servers.enterprise.capabilities",
    "servers.enterprise.capabilities.data",
    "servers.enterprise.capabilities.data.service",
    "servers.enterprise.capabilities.data.tools",
    "servers.enterprise.capabilities.llm",
    "servers.enterprise.capabilities.llm.service",
    "servers.enterprise.capabilities.llm.tools",
    "servers.enterprise.capabilities.vectors",
    "servers.enterprise.capabilities.vectors.service",
    "servers.enterprise.capabilities.vectors.tools",
]

[tool.pytest.ini_options]
# Изолированный прогон. Тесты платформы НЕ входят в тесты агента:
# у платформы своя кодовая база, свой requirements.txt и свой pyproject.toml,
# а корневой testpaths = ["tests"] (skills агента снесены).
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    # Тот же фильтр, что в корневом pyproject.toml: FAISS SWIG-биндинги не имеют
    # __module__, предупреждение приходит из importlib._bootstrap при загрузке
    # C-расширения _faiss (не наш код). Словарь маркеров ниже — тоже единый с
    # корневым, чтобы оба набора фильтровались одинаково.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
# Объявляются только реально применяемые маркеры: объявленный, но не
# используемый маркер вводит в заблуждение («маркер = фильтр CI») и мёртв.
# В платформенных тестах применяются unit-функции pytest (parametrize),
# asyncio_mode=auto и anyio (pytestmark = pytest.mark.anyio в
# tests/test_live_stdio_contract.py) — последний регистрируется плагином
# anyio, поэтому --strict-markers здесь не включается.
markers = [
    "live: live e2e (real gateway / live DB / live LLM); needs NANOBOT_LIVE_E2E=1",
    "integration: worker pool on real DB; needs NANOBOT_INTEGRATION=1 (+ DATABASE_URL)",
    "contract: nanobot-ai compatibility checks; runs in CI always (not gated)",
    "benchmark: offline baseline benchmark (synthetic fixtures); opt-in via -m benchmark",
]
# Верхняя граница времени ОДНОГО теста. Значения — ровно те же, что в
# корневом pyproject.toml: платформа отдельная кодовая база с отдельным
# конфигом, но правило безопасного прогона у неё то же самое.
# До этого границы не было НИ ОДНОЙ — ни опции здесь, ни pytest-timeout в
# зависимостях, ни timeout-minutes в CI: прогон, который должен занять
# десятки секунд, мог висеть бесконечно, накапливая память, и остановить его
# было нечем. Замерено на машине разработчика: норма 157 МБ / 26 с против
# 1.5 ГБ → 3.4 ГБ за ~6 минут, после чего свободная память машины
# (15.7 ГБ всего, 0.4 ГБ осталось) была исчерпана.
# Почему 300, а не 10: в наборе есть намеренно долгие тесты — живой
# stdio-контракт (~11 с), нагрузочные интеграционные, тяжёлые импорты
# (duckdb / faiss / pyarrow), и 10 с рубили бы их ложно. Но тест, держащий
# процесс 6+ минут при норме в десятки секунд, — это дефект: он должен падать
# с диагностикой, а не висеть. 300 с — заведомо выше любого штатного теста и
# заведомо ниже «зависшего намертво».
# timeout_method = "thread": прерывание не убивает сам процесс pytest
# (в отличие от signal), поэтому подвисшие потоки и сервисы теста не тянут за
# собой весь прогон. Работает плагином pytest-timeout: БЕЗ него опция timeout
# молча игнорируется (pytest печатает "Unknown config option: timeout").
timeout = 300
timeout_method = "thread"

[tool.ruff]
# Линтер платформы объявлен ЗДЕСЬ, а не наследуется от корневого pyproject.toml.
# Платформа — независимая кодовая база (свой requirements.txt, свой pytest-конфиг),
# и её правила линтинга не должны зависеть от того, где запущен ruff. Пока этой
# секции не было, ruff поднимался вверх по дереву и находил конфиг корня
# (pyproject.toml без [tool.ruff] конфигурацией ruff не считается): правила
# случайно совпадали, а объявления не существовало — и шага линта в CI не было.
# Настройки — ровно те же, что в корне: единый подход на обе кодовые базы.
line-length = 100
target-version = "py311"
# tests исключены по той же осознанной причине, что и в корневом pyproject.toml:
# тесты — фикстуры с намеренными нарушениями стиля и длинными литералами, их
# чинить массово нельзя. ВНИМАНИЕ: extend-exclude действует только на файлы,
# найденные обходом каталогов. Явно переданный путь (`ruff check tests`) он НЕ
# отсекает — исключение срабатывает лишь с --force-exclude. Поэтому пути,
# исключённые здесь, нельзя передавать в команду линтинга.
extend-exclude = ["tests", "benchmarks", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # function call in defaults (pydantic Field pattern)
    "UP038", # isinstance tuple form (3.12 deprecation, fix later)
]
