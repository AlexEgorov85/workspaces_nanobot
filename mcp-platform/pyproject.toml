[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "enterprise-mcp-platform"
version = "0.1.0"
description = "Enterprise MCP servers, independent from nanobot"
requires-python = ">=3.11"

# ВАЖНО: nanobot-ai здесь отсутствует намеренно и навсегда.
# Установка этого пакета не должна тянуть agent runtime.
dependencies = [
    "mcp>=1.27",
    # Разгрузка синхронных обработчиков с event loop транспорта
    # (anyio.to_thread.run_sync в libs/enterprise_common/loader.py и
    # servers/*/server.py). Объявлен явно, а не «приедет из mcp»: платформа
    # зовёт его сама, и на чужом списке зависимостей держаться нельзя.
    "anyio>=4.0",
    # Владелец доступа к данным. psycopg2 существует ровно в одном пакете
    # платформы — libs/enterprise_data.
    "psycopg2-binary==2.9.12",
    # Обязателен: без AST-ветки guard пропускает pg_sleep, information_schema
    # и UPDATE/DELETE после -- комментария. Сервер не поднимается без него.
    "sqlglot==30.17.0",
    # Владелец HTTP-клиента провайдера (libs/llm).
    "httpx>=0.27",
    # Владелец снимка (libs/enterprise_data/snapshot) и владелец индексов
    # (libs/vectors). Импортируются ЛЕНИВО, внутри функций: отсутствие любого
    # из них не должно мешать подняться серверу и ломать capability, которая
    # с ним не связана, — history_search работает и без FAISS. Смысл зависимостей
    # в том, что установленный пакет платформы функционален целиком.
    "duckdb>=1.0",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    # Сериализация батчей снимка в Arrow (libs/enterprise_data/snapshot/
    # writer.py). Импорт ленивый, но отсутствие пакета — не «мягкая деградация»:
    # writer.py:304 обязан отказать громко, иначе молча уходит пустая таблица.
    "pyarrow>=23.0",
    # Вывод пула PostgreSQL в консоль (libs/enterprise_data/db.py). Тоже
    # ленивый: без него платформа обязана работать, просто молча.
    "rich>=13.0",
    # Разбор офисных документов. Живёт в libs/office (перенесён из агента,
    # п. 11.1) и читается доменом legal_summarizer: document/physical.py,
    # document/loader.py, application/document_io.py. Пины — как в
    # requirements.txt агента: сервер запускается тем же интерпретатором
    # (project.json::enterprise_mcp.command = ${NANOBOT_PYTHON}), поэтому
    # «свой» диапазон версий здесь означал бы расхождение с окружением
    # агента, а не свободу выбора.
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    # .xls (старый бинарный формат) — openpyxl его не читает.
    "xlrd==2.0.2",
    "pypdf==5.9.0",
    "pdfplumber==0.11.10",
    "python-pptx==1.0.2",
    # Определение кодировки текстовых файлов. В libs/office/parser.py
    # необязателен: без него кодировка подбирается перебором
    # utf-8/cp1251/latin-1, но точность падает, поэтому пакет объявлен.
    "chardet==7.6.0",
    # Структурированный лог домена (libs/legal_summarizer/document/hierarchy.py).
    "loguru==0.7.3",
]

[project.optional-dependencies]
# capability legal (фаза 8): python-docx, openpyxl, pypdf, pdfplumber, python-pptx, Pillow
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools]
# Явный список, а не find_packages: лишний пакет в платформе должен попасть
# сюда руками и быть замечен в diff'е, а не подхватиться молча.
packages = [
    "libs",
    "libs.enterprise_common",
    "libs.enterprise_data",
    "libs.enterprise_data.snapshot",
    "libs.llm",
    "libs.vectors",
    "servers",
    "servers._template",
    "servers._template.capabilities",
    "servers._template.capabilities.template",
    "servers._template.capabilities.template.service",
    "servers._template.capabilities.template.tools",
    "servers.enterprise",
    "servers.enterprise.capabilities",
    "servers.enterprise.capabilities.data",
    "servers.enterprise.capabilities.data.service",
    "servers.enterprise.capabilities.data.tools",
    "servers.enterprise.capabilities.llm",
    "servers.enterprise.capabilities.llm.service",
    "servers.enterprise.capabilities.llm.tools",
    "servers.enterprise.capabilities.vectors",
    "servers.enterprise.capabilities.vectors.service",
    "servers.enterprise.capabilities.vectors.tools",
]

[tool.pytest.ini_options]
# Изолированный прогон. Тесты платформы НЕ входят в тесты агента
# (в корневом pyproject testpaths остаются tests/ и skills).
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
